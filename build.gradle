plugins {
    id 'com.android.application'
}

android {
    namespace 'pk.org.bide.opdregistry'
    compileSdk 35

    defaultConfig {
        applicationId 'pk.org.bide.opdregistry'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('BIDE_KEYSTORE')
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('BIDE_STORE_PASSWORD')
                keyAlias System.getenv('BIDE_KEY_ALIAS')
                keyPassword System.getenv('BIDE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('BIDE_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
